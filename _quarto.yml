project:
  type: website
  pre-render: _scripts/download-data.R
  post-render: _scripts/cleanup-data.R
  render:
    - "*.qmd"
    - "!README.md"
    - "!CLAUDE.md"

website:
  title: "multised (clean)"
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/seafood-hazards/multised-clean
        aria-label: GitHub
    left:
      - text: "Home"
        href: index.qmd
      - text: "DB Design"
        menu:
          - text: "DB Schema (Clean)"
            href: db-schema-clean.qmd
          - text: "Database Downloads"
            href: database-downloads.qmd
          - text: "Site locations"
            href: site-locations.qmd
      - text: "Analyses"
        menu:
          - text: "Summary"
            href: summary.qmd
          - text: "Grain size"
            href: grain-size.qmd
          - text: "Fe/Al normalisation"
            href: normalisation.qmd
          - text: "Organic carbon"
            href: organic-carbon.qmd
          - text: "Synthesis"
            href: synthesis.qmd
          - text: "Depth and coast"
            href: spatial.qmd
          - text: "Sampling year"
            href: temporal.qmd
      - text: "Aquaculture"
        menu:
          - text: "Aquaculture data"
            href: aquaculture-data.qmd
          - text: "Aquaculture summary"
            href: aquaculture-summary.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    df-print: kable

execute:
  echo: false
  warning: false
